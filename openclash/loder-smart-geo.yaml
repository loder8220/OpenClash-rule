      filter: "(?i)(日本|jp|japan|新加坡|sg|singapore|美国|us|united states)",
    }
  - {
      name: Gemini自动,
      type: url-test,
      include-all: true,
      tolerance: 20,
      interval: 300,
      filter: "(?i)(香港|hk|hongkong|台湾|tw|taiwan|日本|jp|japan|新加坡|sg|singapore|美国|us|usa|unitedstates|united states)",
