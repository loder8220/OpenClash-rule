# 自己手搓的配置文件，参考：https://wiki.metacubex.one/example/conf/

#使用smart智能
#使用GEO数据库
# 已固化 LuCI 中可映射为 Mihomo YAML 的覆写项。
# OpenClash 服务启停、核心选择、dnsmasq 缓存/AAAA 过滤、DHCP、
# 防火墙 DNS 劫持和面板认证属于 OpenWrt/OpenClash 运行设置，无法写入本文件。

# 订阅相关配置
proxy-providers:
  hongxingyun: #唯一名称，自定义
    type: http #协议
    interval: 3600 #更新周期
    health-check: #可用检查
      {
        enable: true, #开启
        url: "https://www.gstatic.com/generate_204", #检查使用的地址
        interval: 300, #检查周期
      }
    # url 里填写自己的订阅,名称不能重复
    url: ""
  mojie:
    type: http
    interval: 3600
    health-check:
      {
        enable: true,
        url: "https://www.gstatic.com/generate_204",
        interval: 300,
      }
    # url 里填写自己的订阅,名称不能重复
    url: ""

# 协议栈配置
ipv6: true
allow-lan: true
mode: rule
unified-delay: true
tcp-concurrent: true
mixed-port: 7893
external-controller: 0.0.0.0:9090

profile:
  store-selected: true
  store-fake-ip: true

# 嗅探配置
sniffer:
  enable: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: false
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443]
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"
  parse-pure-ip: true

tun:
  enable: true
  stack: mixed
  device: utun
  dns-hijack:
    - "127.0.0.1:53"
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false
  disable-icmp-forwarding: false
  gso: true

# 需要开启 dnsmasq劫持DNS，在网络->DNS->勾选 DNS 重定向
dns:
  enable: true
  ipv6: true
  nameserver-policy:
    "geosite:category-ads-all": rcode://success
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:geolocation-!cn":
      - "https://cloudflare-dns.com/dns-query#智能选择"
      - "https://dns.google/dns-query#智能选择"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 需要关闭 dnsmasq 的重绑定保护，在网络DNS->筛选-> 取消勾选 重绑定保护
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter:
    - "+.lan"
    - "+.local"
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - tls://223.5.5.5
    - tls://223.6.6.6
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  listen: 0.0.0.0:7874
  respect-rules: false
  use-hosts: true

#直连，固定写法
proxies:
  - name: "直连"
    type: direct
    udp: true

